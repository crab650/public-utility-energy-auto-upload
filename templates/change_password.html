{% extends "base.html" %}

{% block content %}
<div class="panel login-box">
    <h1>變更密碼</h1>
    {% if must_change_password %}
        <p>首次登入必須先變更預設密碼，才能使用系統。</p>
    {% endif %}
    <form method="post">
        <div style="margin-bottom: 12px;">
            <label for="current_password">目前密碼</label>
            <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
        </div>
        <div style="margin-bottom: 12px;">
            <label for="new_password">新密碼</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div style="margin-bottom: 16px;">
            <label for="confirm_password">再次輸入新密碼</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit">儲存新密碼</button>
    </form>
</div>
{% endblock %}
